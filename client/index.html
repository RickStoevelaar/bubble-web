<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bubble Web</title>
    <meta name="description" content="Two-player bubble-blowing platform game." />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black" (opaque bar, viewport below it): the layout handles the bottom/side insets but not a top inset -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Bubble Web" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: absolute;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
      #deck {
        position: absolute;
        display: none;
        background: #0b0b12;
        border-top: 1px solid #222233;
        box-sizing: border-box;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #safe {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      #install {
        position: fixed;
        left: calc(10px + env(safe-area-inset-left, 0px));
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        padding: 8px 14px;
        font: bold 16px system-ui, sans-serif;
        letter-spacing: 1px;
        color: #10142a;
        background: #bfe9ff;
        border: 2px solid #eefaff;
        border-bottom-color: #4a86b0;
        border-radius: 10px;
        touch-action: manipulation;
      }
      #install[hidden] {
        display: none;
      }
      #join {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.88);
        font-family: system-ui, sans-serif;
        color: #eee;
        touch-action: auto;
        -webkit-user-select: auto;
        user-select: auto;
        -webkit-touch-callout: default;
      }
      #join[hidden],
      #status[hidden] {
        display: none;
      }
      #join form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(320px, 86vw);
      }
      #join h1 {
        margin: 0 0 4px;
        font-size: 22px;
        text-align: center;
      }
      #join label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
      }
      #join input {
        font-size: 18px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #556;
        background: #12121c;
        color: #fff;
      }
      #join button {
        font-size: 18px;
        padding: 10px;
        border-radius: 6px;
        border: 0;
        background: #4a8cff;
        color: #fff;
      }
      #join button:disabled {
        opacity: 0.6;
      }
      #join button.secondary {
        background: transparent;
        border: 1px solid #556;
        color: #ccd;
        padding: 8px;
      }
      #join label.check {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      #join label.check input {
        width: 20px;
        height: 20px;
      }
      #join .note,
      #join-hint {
        font-size: 12px;
        color: #9aa;
        margin-top: -6px;
      }
      #join-hint {
        color: #ffd36b;
        margin-top: 0;
      }
      #join-hint[hidden] {
        display: none;
      }
      #gameover-actions {
        position: absolute;
        display: flex;
        gap: 12px;
        box-sizing: border-box;
        touch-action: manipulation;
      }
      #gameover-actions[hidden] {
        display: none;
      }
      #gameover-actions button {
        flex: 1;
        min-height: 44px;
        font: bold 22px system-ui, sans-serif;
        letter-spacing: 1px;
        color: #10142a;
        background: #ffe34a;
        border: 3px solid #fff6b0;
        border-bottom-color: #b89b00;
        border-radius: 12px;
        touch-action: manipulation;
      }
      #gameover-actions button.quit {
        background: #bfe9ff;
        border-color: #eefaff;
        border-bottom-color: #4a86b0;
      }
      #gameover-actions button:disabled {
        opacity: 0.5;
      }
      #gameover-actions button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
      #join-error {
        min-height: 1.2em;
        color: #ff8a8a;
        font-size: 14px;
        text-align: center;
      }
      #status {
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        text-align: center;
        font: 14px system-ui, sans-serif;
        color: #ffd36b;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="deck"></div>
    <div id="safe" aria-hidden="true"></div>
    <div id="status" hidden></div>
    <button id="install" type="button" hidden>INSTALL</button>
    <div id="join" hidden>
      <form id="join-form" autocomplete="off">
        <h1>Bubble Web</h1>
        <label>Room code<input id="room" name="room" maxlength="12" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" required /></label>
        <div id="join-hint" role="note" hidden></div>
        <label>Household PIN<input id="pin" name="pin" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required /></label>
        <label class="check"><input id="remember-pin" type="checkbox" />remember PIN on this device</label>
        <div class="note">stored on this device only</div>
        <label>Your name<input id="name" name="name" maxlength="16" autocomplete="off" autocorrect="off" spellcheck="false" /></label>
        <button id="join-go" type="submit">Join</button>
        <button id="join-back" type="button" class="secondary">Back</button>
        <div id="join-error" role="alert"></div>
      </form>
    </div>
    <div id="gameover-actions" hidden>
      <button id="go-continue" type="button">CONTINUE</button>
      <button id="go-quit" type="button" class="quit">QUIT</button>
    </div>
    <script defer src="main.js"></script>
  </body>
</html>
