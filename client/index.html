<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bubble Web</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: absolute;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
      #deck {
        position: absolute;
        display: none;
        background: #0b0b12;
        border-top: 1px solid #222233;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="deck"></div>
    <script defer src="main.js"></script>
  </body>
</html>
