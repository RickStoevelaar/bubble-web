<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bubble Web</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: absolute;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
      #deck {
        position: absolute;
        display: none;
        background: #0b0b12;
        border-top: 1px solid #222233;
      }
      #join {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.88);
        font-family: system-ui, sans-serif;
        color: #eee;
        touch-action: auto;
        -webkit-user-select: auto;
        user-select: auto;
      }
      #join[hidden],
      #status[hidden] {
        display: none;
      }
      #join form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(320px, 86vw);
      }
      #join h1 {
        margin: 0 0 4px;
        font-size: 22px;
        text-align: center;
      }
      #join label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
      }
      #join input {
        font-size: 18px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #556;
        background: #12121c;
        color: #fff;
      }
      #join button {
        font-size: 18px;
        padding: 10px;
        border-radius: 6px;
        border: 0;
        background: #4a8cff;
        color: #fff;
      }
      #join button:disabled {
        opacity: 0.6;
      }
      #join-error {
        min-height: 1.2em;
        color: #ff8a8a;
        font-size: 14px;
        text-align: center;
      }
      #status {
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        text-align: center;
        font: 14px system-ui, sans-serif;
        color: #ffd36b;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="deck"></div>
    <div id="status" hidden></div>
    <div id="join">
      <form id="join-form" autocomplete="off">
        <h1>Bubble Web</h1>
        <label>Room code<input id="room" name="room" maxlength="12" autocapitalize="characters" required /></label>
        <label>Household PIN<input id="pin" name="pin" type="password" inputmode="numeric" required /></label>
        <label>Your name<input id="name" name="name" maxlength="16" /></label>
        <button id="join-go" type="submit">Join</button>
        <div id="join-error" role="alert"></div>
      </form>
    </div>
    <script defer src="main.js"></script>
  </body>
</html>
