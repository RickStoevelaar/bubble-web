name: bubbleweb
services:
  bubbleweb:
    build: .
    image: bubbleweb:latest
    restart: unless-stopped
    environment:
      PIN: ${PIN:?set PIN in .env}
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    cpus: "0.5"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks: [web]

networks:
  web:
    external: true
